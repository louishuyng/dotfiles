[package]
name = "dotbin"
version = "0.1.0"
edition = "2021"
description = "Hot-path tmux status helpers (sysstat, watt, agents, focus-history)"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
unicode-segmentation = "1"
