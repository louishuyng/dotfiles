<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<meta name="description" content="Your private, local control room for agent skills, integrations, instructions, and recorded usage."/>
<link rel="preload" href="/fonts/host-grotesk.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="icon" type="image/svg+xml" href="/logo.svg"/>
<title>Agent Hub</title>
<style>
  /* Hallmark · shape: app screen · theme: Console · splash shown before the stylesheet loads, tokens mirror src/tokens.css */
  html, body { overflow-x: clip; }
  :root { --splash-paper: oklch(98% 0.006 85); --splash-ink: oklch(19% 0.01 60); --splash-muted: oklch(46% 0.012 60); --splash-rule: oklch(88% 0.008 80); --splash-accent: oklch(54% 0.14 70); --splash-font: "Host Grotesk", ui-sans-serif, system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --splash-paper: oklch(17% 0.008 250); --splash-ink: oklch(95% 0.005 250); --splash-muted: oklch(71% 0.01 250); --splash-rule: oklch(31% 0.01 250); --splash-accent: oklch(82% 0.15 80); } }
  .splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: var(--splash-paper); color: var(--splash-ink); font-family: var(--splash-font); transition: opacity 320ms ease, visibility 320ms ease; }
  .splash.hide { opacity: 0; visibility: hidden; }
  .splash-body { display: grid; justify-items: center; gap: 12px; text-align: center; }
  .splash-logo { width: 56px; height: 56px; border-radius: 10px; }
  .splash-title { font-size: 20px; font-weight: 500; letter-spacing: -0.03em; margin: 4px 0 0; }
  .splash-sub { font-size: 14px; color: var(--splash-muted); margin: 0; }
  .splash-bar { width: 160px; height: 2px; background: var(--splash-rule); overflow: hidden; margin-top: 8px; }
  .splash-bar span { display: block; width: 40%; height: 100%; background: var(--splash-accent); animation: splash-load 1.3s ease-in-out infinite; }
  @keyframes splash-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .splash-bar span { animation: none; width: 100%; } }
</style>
</head>
<body>
<div id="splash" class="splash" role="status" aria-live="polite">
  <div class="splash-body">
    <img class="splash-logo" src="/logo.svg" alt="" width="56" height="56"/>
    <p class="splash-title">Agent Hub</p>
    <p class="splash-sub">Connecting to your local agents…</p>
    <div class="splash-bar" aria-hidden="true"><span></span></div>
  </div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
